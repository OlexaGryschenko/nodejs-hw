<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скидання пароля</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2>Привіт, {{name}}!</h2>
  <p>Ми отримали запит на скидання пароля для твого акаунта.</p>
  <p>Натисни кнопку нижче, щоб створити новий пароль:</p>
  <p style="text-align: center; margin: 30px 0;">
    <a href="{{link}}" style="background-color: #007bff; color: white; padding: 12px 20px; text-decoration: none; border-radius: 4px; display: inline-block;">
      Скинути пароль
    </a>
  </p>
  <p>Це посилання дійсне протягом 15 хвилин.</p>
  <p>Якщо ви не робили цей запит, просто проігноруйте цей лист.</p>
</body>
</html>
